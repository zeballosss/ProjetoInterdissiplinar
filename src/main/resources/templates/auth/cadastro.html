<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Criar conta')}"></head>
<body class="pagina-auth">
<nav th:replace="~{fragments/layout :: navbar('outro')}"></nav>
<main class="container py-5">
    <div class="auth-card mx-auto">
        <div class="text-center mb-4">
            <span class="eyebrow text-verde">FAÇA PARTE</span>
            <h1 class="h2 fw-bold mt-2">Criar uma conta</h1>
            <p class="text-secondary">Seu cadastro permite favoritar e avaliar jogadores.</p>
        </div>
        <div class="alert alert-danger" th:if="${erroCadastro}" th:text="${erroCadastro}">Verifique os dados.</div>
        <form th:action="@{/cadastro}" method="post">
            <div class="mb-3">
                <label for="nome" class="form-label fw-semibold">Nome</label>
                <input class="form-control" id="nome" name="nome" type="text" maxlength="100" autocomplete="name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">E-mail</label>
                <input class="form-control" id="email" name="email" type="email" maxlength="150" autocomplete="email" required>
            </div>
            <div class="mb-3">
                <label for="senha" class="form-label fw-semibold">Senha</label>
                <input class="form-control" id="senha" name="senha" type="password" minlength="6" autocomplete="new-password" required>
                <div class="form-text">Use pelo menos 6 caracteres.</div>
            </div>
            <button type="submit" class="btn btn-copa btn-lg w-100 mt-2">Criar conta</button>
        </form>
        <p class="text-center text-secondary mt-4 mb-0">Já tem cadastro? <a th:href="@{/login}">Entrar</a>.</p>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
