<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Jogadores')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('jogadores')}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4">
        <div>
            <span class="eyebrow text-verde">CATÁLOGO</span>
            <h1 class="fw-bold mb-1">Todos os jogadores</h1>
            <p class="text-secondary mb-0">Pesquise pelo nome do jogador ou pela seleção.</p>
        </div>
        <form th:action="@{/jogadores}" method="get" class="d-flex gap-2 search-lista">
            <input class="form-control" type="search" name="busca" th:value="${busca}" placeholder="Ex.: Brasil, Messi..." aria-label="Buscar">
            <button class="btn btn-copa" type="submit">Buscar</button>
        </form>
    </div>

    <div class="small text-secondary mb-3" th:text="${jogadores.size() + ' resultado(s)'}">10 resultados</div>
    <div class="row g-4" th:if="${!jogadores.isEmpty()}">
        <div class="col-sm-6 col-lg-3" th:each="jogador : ${jogadores}">
            <article th:replace="~{fragments/jogador-card :: card(${jogador})}"></article>
        </div>
    </div>
    <div class="empty-state" th:if="${jogadores.isEmpty()}">
        <div class="display-5">🔎</div>
        <h2 class="h4">Nenhum resultado encontrado</h2>
        <p class="text-secondary">Tente pesquisar por outro nome ou seleção.</p>
        <a th:href="@{/jogadores}" class="btn btn-outline-dark">Limpar pesquisa</a>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
