<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Cadastro - Copa do Mundo</title>
</head>
<body class="bg-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
        <div class="card shadow-sm border-0 w-100" style="max-width: 460px;">
            <div class="card-body p-4">
        <h1 class="h3 mb-4">Cadastro</h1>
        <form th:action="@{/registro}" th:object="${usuario}" method="post">
            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input id="nome" type="text" th:field="*{nome}" class="form-control" required>
                <div th:if="${#fields.hasErrors('nome')}" class="text-danger small mt-1" th:errors="*{nome}"></div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" type="email" th:field="*{email}" class="form-control" required>
                <div th:if="${#fields.hasErrors('email')}" class="text-danger small mt-1" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input id="senha" type="password" th:field="*{senha}" class="form-control" required>
                <div th:if="${#fields.hasErrors('senha')}" class="text-danger small mt-1" th:errors="*{senha}"></div>
            </div>

            <button type="submit" class="btn btn-success w-100">Cadastrar</button>
        </form>
        <div th:if="${erro}" class="alert alert-danger mt-3 mb-0" th:text="${erro}"></div>
        <a th:href="@{/login}" class="d-block mt-3">Já tenho conta</a>
            </div>
        </div>
    </main>
</body>
</html>
