<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Enciclopedia da Copa'">Enciclopedia da Copa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-copa sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <span class="brand-bola">●</span> ENCICLOPÉDIA <span class="brand-destaque">DA COPA</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Início</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/jogadores}">Jogadores</a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/favoritos}">Meus favoritos</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link admin-link" th:href="@{/admin/jogadores}">Painel admin</a>
                </li>
                <li class="nav-item ms-lg-2" sec:authorize="isAnonymous()">
                    <a class="btn btn-outline-light btn-sm px-3" th:href="@{/login}">Entrar</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="btn btn-copa btn-sm px-3" th:href="@{/cadastro}">Criar conta</a>
                </li>
                <li class="nav-item d-flex align-items-center gap-2 ms-lg-2" sec:authorize="isAuthenticated()">
                    <span class="text-white-50 small" sec:authentication="principal.nome">Usuário</span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button class="btn btn-outline-light btn-sm" type="submit">Sair</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="alerts" class="container pt-3">
    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${mensagem}">
        <span th:text="${mensagem}">Operacao realizada.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${erro}">
        <span th:text="${erro}">Ocorreu um erro.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
</div>

<footer th:fragment="footer" class="footer-copa mt-5">
    <div class="container py-4 d-flex flex-column flex-md-row justify-content-between gap-2">
        <div>
            <strong>Enciclopédia da Copa</strong>
            <div class="small text-white-50">Um espaço para conhecer e avaliar jogadores.</div>
        </div>
        <div class="small text-white-50 align-self-md-center">Projeto interdisciplinar · ETEC</div>
    </div>
</footer>
</body>
</html>
