spring.application.name=enciclopedia_db
server.port=8080

# Configuracao do banco de dados PostgreSQL da escola
spring.datasource.url=jdbc:postgresql://localhost:5432/Enciclopedia_db
spring.datasource.username=postgres
spring.datasource.password=postdba
spring.datasource.driver-class-name=org.postgresql.Driver

# Atualizar as tabelas automaticamente sem apagar os dados
spring.jpa.hibernate.ddl-auto=update

# Configuracao do SQL no console
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=true

# Configuracao das paginas
spring.thymeleaf.cache=false

# Administrador criado automaticamente na primeira inicializacao
app.admin.email=${ADMIN_EMAIL:admin@copa.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Fotos enviadas pelo administrador (salvas na pasta uploads do projeto)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.dir=uploads
