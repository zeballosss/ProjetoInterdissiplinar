<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Copa do Mundo</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); width: 420px; }
        input, button { width: 100%; margin-top: 12px; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; box-sizing: border-box; }
        button { background: #16a34a; color: white; border: none; cursor: pointer; }
        .error { color: #b91c1c; margin-top: 10px; }
        a { display: inline-block; margin-top: 14px; text-decoration: none; color: #1d4ed8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Cadastro</h2>
        <form th:action="@{/registro}" th:object="${usuario}" method="post">
            <input type="text" th:field="*{nome}" placeholder="Nome" required>
            <div th:if="${#fields.hasErrors('nome')}" class="error" th:errors="*{nome}"></div>

            <input type="email" th:field="*{email}" placeholder="Email" required>
            <div th:if="${#fields.hasErrors('email')}" class="error" th:errors="*{email}"></div>

            <input type="password" th:field="*{senha}" placeholder="Senha" required>
            <div th:if="${#fields.hasErrors('senha')}" class="error" th:errors="*{senha}"></div>

            <button type="submit">Cadastrar</button>
        </form>
        <div th:if="${erro}" class="error" th:text="${erro}"></div>
        <a th:href="@{/login}">Já tenho conta</a>
    </div>
</body>
</html>
