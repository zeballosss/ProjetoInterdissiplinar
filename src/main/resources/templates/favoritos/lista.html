<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Meus favoritos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('favoritos')}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="container py-5">
    <span class="eyebrow text-verde">SUA LISTA</span>
    <h1 class="fw-bold mb-1">Meus favoritos</h1>
    <p class="text-secondary mb-4">Os jogadores que você escolheu acompanhar.</p>

    <div class="row g-4" th:if="${!favoritos.isEmpty()}">
        <div class="col-sm-6 col-lg-3" th:each="favorito : ${favoritos}">
            <article th:replace="~{fragments/jogador-card :: card(${favorito.jogador})}"></article>
        </div>
    </div>
    <div class="empty-state" th:if="${favoritos.isEmpty()}">
        <div class="display-5">♡</div>
        <h2 class="h4">Sua lista ainda está vazia</h2>
        <p class="text-secondary">Visite um perfil e escolha adicionar aos favoritos.</p>
        <a th:href="@{/jogadores}" class="btn btn-copa">Explorar jogadores</a>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
