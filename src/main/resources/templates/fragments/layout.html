<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Enciclopedia da Copa'">Enciclopedia da Copa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<nav th:fragment="navbar(secao)" class="navbar navbar-expand-lg navbar-dark sticky-top navbar-copa">
    <div class="container">
        <a class="navbar-brand fs-6" th:href="@{/}">Enciclopédia da Copa</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-2 py-2 py-lg-0">
                <li class="nav-item"><a class="nav-link" th:href="@{/}" th:classappend="${secao == 'inicio'} ? ' active' : ''" th:attr="aria-current=${secao == 'inicio' ? 'page' : null}">Início</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/jogadores}" th:classappend="${secao == 'jogadores'} ? ' active' : ''" th:attr="aria-current=${secao == 'jogadores' ? 'page' : null}">Jogadores</a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/favoritos}" th:classappend="${secao == 'favoritos'} ? ' active' : ''" th:attr="aria-current=${secao == 'favoritos' ? 'page' : null}">Meus favoritos</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/jogadores}" th:classappend="${secao == 'admin'} ? ' active' : ''" th:attr="aria-current=${secao == 'admin' ? 'page' : null}">Painel admin</a>
                </li>
                <li class="nav-item ms-lg-2" sec:authorize="isAnonymous()">
                    <a class="btn btn-outline-light btn-sm px-3" th:href="@{/login}">Entrar</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="btn btn-outline-light btn-sm px-3" th:href="@{/cadastro}">Criar conta</a>
                </li>
                <li class="nav-item d-flex align-items-center gap-2 ms-lg-2" sec:authorize="isAuthenticated()">
                    <span class="text-white small text-break" sec:authentication="principal.nome">Usuário</span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button class="btn btn-outline-light btn-sm" type="submit">Sair</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="alerts" class="container pt-3" th:if="${mensagem != null or erro != null}">
    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${mensagem}">
        <span th:text="${mensagem}">Operação realizada.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${erro}">
        <span th:text="${erro}">Ocorreu um erro.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
</div>

<form th:fragment="busca(termo)" th:action="@{/jogadores}" method="get" class="row g-2">
    <div class="col-12 col-sm-7 col-lg-5">
        <label for="busca" class="visually-hidden">Buscar jogador ou seleção</label>
        <input id="busca" class="form-control" type="search" name="busca" th:value="${termo}"
               placeholder="Nome do jogador ou seleção">
    </div>
    <div class="col-auto">
        <button class="btn btn-success" type="submit">Buscar</button>
    </div>
</form>

<footer th:fragment="footer" class="border-top mt-4">
    <p class="container py-3 mb-0 small text-body-secondary">Enciclopédia da Copa · Projeto interdisciplinar da ETEC</p>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>
</body>
</html>
