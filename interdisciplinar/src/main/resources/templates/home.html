<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Home - Copa do Mundo</title>
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">Álbum da Copa do Mundo</h1>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-secondary">Sair</button>
            </form>
        </div>
        <div class="alert alert-success">Você está autenticado com sucesso.</div>
    </main>
</body>
</html>
