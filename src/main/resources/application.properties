spring.application.name=Enciclopedia_db

# Configuração do Banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5432/Enciclopedia_db
spring.datasource.username=postgres
spring.datasource.password=postdba

#Atualizar As Tabelas do Banco De Dados Automaticamente
spring.jpa.hibernate.ddl-auto=update

#Não Formatar os comandos SQL no console
spring.jpa.properties.hibernate.format_sql=false

#Mostrar os Comandos SQL no console 
spring.jpa.show-sql=true

#configurar a porta do servidor 
server.port=8080

# Configuracao das paginas
spring.thymeleaf.cache=false

# Administrador criado automaticamente na primeira inicializacao
app.admin.email=${ADMIN_EMAIL:admin@copa.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Fotos enviadas pelo administrador (salvas na pasta uploads do projeto)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.dir=${UPLOAD_DIR:uploads}
