<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Copa do Mundo</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); width: 360px; }
        input, button { width: 100%; margin-top: 12px; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; }
        button { background: #2563eb; color: white; border: none; cursor: pointer; }
        a { display: inline-block; margin-top: 14px; text-decoration: none; color: #1d4ed8; }
        .error { color: #b91c1c; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Login</h2>
        <form th:action="@{/login}" method="post">
            <input type="text" name="username" placeholder="Email" required>
            <input type="password" name="password" placeholder="Senha" required>
            <button type="submit">Entrar</button>
        </form>
        <div th:if="${param.error}" class="error">Email ou senha inválidos.</div>
        <div th:if="${param.logout}" class="error">Você saiu do sistema.</div>
        <a th:href="@{/registro}">Criar conta</a>
    </div>
</body>
</html>
