<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Meus favoritos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="container py-5">
    <span class="eyebrow text-verde">SUA LISTA</span>
    <h1 class="fw-bold mb-1">Meus favoritos</h1>
    <p class="text-secondary mb-4">Os jogadores que você escolheu acompanhar.</p>

    <div class="row g-4" th:if="${!favoritos.isEmpty()}">
        <div class="col-sm-6 col-lg-3" th:each="favorito : ${favoritos}">
            <article class="card jogador-card h-100">
                <div class="jogador-card-top">
                    <img th:if="${favorito.jogador.imagemUrl != null and !favorito.jogador.imagemUrl.isBlank()}" th:src="${favorito.jogador.imagemUrl}" th:alt="${favorito.jogador.nome}" class="jogador-imagem"
                         onerror="this.classList.add('d-none'); this.nextElementSibling.classList.remove('d-none');">
                    <div class="jogador-inicial" th:classappend="${favorito.jogador.imagemUrl != null and !favorito.jogador.imagemUrl.isBlank()} ? ' d-none' : ''" th:text="${#strings.substring(favorito.jogador.nome, 0, 1)}">J</div>
                </div>
                <div class="card-body">
                    <div class="small text-verde fw-semibold" th:text="${favorito.jogador.selecao}">Seleção</div>
                    <h2 class="h5 fw-bold mt-1" th:text="${favorito.jogador.nome}">Jogador</h2>
                    <p class="text-secondary small" th:text="${favorito.jogador.posicao}">Posição</p>
                    <a class="stretched-link link-copa" th:href="@{/jogadores/{id}(id=${favorito.jogador.id})}">Ver perfil <span aria-hidden="true">→</span></a>
                </div>
            </article>
        </div>
    </div>
    <div class="empty-state" th:if="${favoritos.isEmpty()}">
        <div class="display-5">♡</div>
        <h2 class="h4">Sua lista ainda está vazia</h2>
        <p class="text-secondary">Visite um perfil e escolha adicionar aos favoritos.</p>
        <a th:href="@{/jogadores}" class="btn btn-copa">Explorar jogadores</a>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
