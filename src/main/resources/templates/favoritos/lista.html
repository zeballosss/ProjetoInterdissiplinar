<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Meus favoritos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('favoritos')}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="container py-4">
    <h1 class="mb-3">Meus favoritos</h1>
    <div th:replace="~{fragments/jogador-card :: grade(${jogadores})}"></div>
    <div th:if="${jogadores.isEmpty()}">
        <p>Você ainda não favoritou nenhum jogador.</p>
        <a th:href="@{/jogadores}" class="btn btn-success">Ver jogadores</a>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
