<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Entrar')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('outro')}"></nav>
<main class="container py-4">
    <div class="col-sm-8 col-md-6 col-lg-4 mx-auto">
        <h1 class="h2 mb-3">Entrar na conta</h1>
        <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}">Cadastro concluído.</div>
        <div class="alert alert-danger" th:if="${param.error}">E-mail ou senha incorretos.</div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">E-mail</label>
                <input class="form-control" id="email" name="email" type="email" autocomplete="username" required>
            </div>
            <div class="mb-3">
                <label for="senha" class="form-label fw-semibold">Senha</label>
                <input class="form-control" id="senha" name="senha" type="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-success w-100 mt-2">Entrar</button>
        </form>
        <p class="text-body-secondary mt-3 mb-0">Ainda não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a>.</p>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
