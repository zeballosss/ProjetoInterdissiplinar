<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Login - Copa do Mundo</title>
</head>
<body class="bg-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
        <div class="card shadow-sm border-0 w-100" style="max-width: 400px;">
            <div class="card-body p-4">
        <h1 class="h3 mb-4">Login</h1>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Email</label>
                <input id="username" type="email" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <input id="password" type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
        <div th:if="${param.error}" class="alert alert-danger mt-3 mb-0">Email ou senha inválidos.</div>
        <div th:if="${param.logout}" class="alert alert-info mt-3 mb-0">Você saiu do sistema.</div>
        <a th:href="@{/registro}" class="d-block mt-3">Criar conta</a>
            </div>
        </div>
    </main>
</body>
</html>
